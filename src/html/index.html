<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>microBRsoil</title>
    <!--
    Hey everyone, the reason I'm using bootstrap minimal is that I don't see much reason to use
    the more "robust" bootstrap version, much less the entire modules folder. So I chose the minimal build,
    which removes some whitespace, makes some commands simpler, and trims a few MBs from the project, making it lighter.

    *Note about CDN (CSS and JS) vs local: I kept the local version so if there is a connection problem while
    anyone is working on the frontend in general, bootstrap continues to work without issues. If someone thinks
    there is a real benefit to using the CDN instead of local (which I personally do not see), please let me know
    so we can discuss and change it. I believe the local build is fine and I don't see any downside other than
    installation convenience (which is 100% because you don't need to install anything :P), but I could be wrong.
    If you want to use the CDN version (both CSS and JS), it is already set up in the project. Just comment out
    the local version and uncomment the CDN version, but please let the group know before doing that.

    Signed: Matheus (non-regular-bootstrapuser-sorry)
    -->

    <!--#region BOOTSTRAP CSS IMPORT-->
    <!--===================================================================================================================================-->
    <!--BOOTSTRAP CDN CSS IMPORT *USE IF YOU NEED IT; **COMMENT THE BOOTSTRAP LOCAL CSS IMPORT BELOW BEFORE USE CDN-->
    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">-->

    <!--BOOTSTRAP MINIMAL LOCAL CSS IMPORT-->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <!--===================================================================================================================================-->
    <!--#endregion-->
    
    <!--LOCAL CSS IMPORT-->
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/header.css">
    <link rel="stylesheet" href="../static/css/footer.css">
    <link rel="stylesheet" href="../static/css/home.css">
    <link rel="stylesheet" href="../static/css/left_menu.css">
    <link rel="stylesheet" href="../static/css/home-filter.css">
    <link rel="stylesheet" href="../static/css/dynamic-content.css">
    <!--FONT IMPORT-->
    <!--INTER-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <!--TIENNE-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tienne:wght@400;700;900&display=swap" rel="stylesheet">
    <!--ICONS IMPORT-->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@300" rel="stylesheet" />
  </head>
  
<body>
  <!--HEADER PLACEHOLDER-->
  <div id="header-placeholder"></div>
  
  <!--#region LAYOUT-->
  <div class="layout">
    <!--LEFT MENU PLACEHOLDER-->
    <div id="leftmenu-placeholder"></div>
    <!--#region MAIN -->
    <main class="main-content">
      <div id="home">
      <span id="dashboard">
        <span class="home-title-row">
          <h1 class="main-title">HOME</h1>
        </span>
        <div id="adminDashboard" class="basic-frame admin-dashboard d-none">
          <div class="admin-dashboard-header">
            <div class="admin-dashboard-title">
              <span class="material-symbols-rounded">insights</span>
              <div>
                <div class="admin-dashboard-title-text">Admin pipeline overview</div>
                <div class="admin-dashboard-subtitle">Live counters for the processing queue</div>
              </div>
            </div>
            <div class="admin-dashboard-meta">
              <span class="material-symbols-rounded">schedule</span>
              <span id="adminStatsUpdated">Loading...</span>
            </div>
          </div>
          <div class="admin-dashboard-grid">
            <div class="admin-stat-card" data-tone="queued">
              <span class="material-symbols-rounded admin-stat-icon">hourglass_empty</span>
              <div>
                <div class="admin-stat-label">Queued</div>
                <div class="admin-stat-value" id="adminQueuedCount">0</div>
              </div>
            </div>
            <div class="admin-stat-card" data-tone="running">
              <span class="material-symbols-rounded admin-stat-icon">autorenew</span>
              <div>
                <div class="admin-stat-label">Running</div>
                <div class="admin-stat-value" id="adminRunningCount">0</div>
              </div>
            </div>
            <div class="admin-stat-card" data-tone="failed">
              <span class="material-symbols-rounded admin-stat-icon">error</span>
              <div>
                <div class="admin-stat-label">Failed</div>
                <div class="admin-stat-value" id="adminFailedCount">0</div>
              </div>
            </div>
            <div class="admin-stat-card" data-tone="duration">
              <span class="material-symbols-rounded admin-stat-icon">timelapse</span>
              <div>
                <div class="admin-stat-label">Avg duration</div>
                <div class="admin-stat-value" id="adminAvgDuration">-</div>
              </div>
            </div>
            <div class="admin-stat-card" data-tone="upload">
              <span class="material-symbols-rounded admin-stat-icon">cloud_upload</span>
              <div>
                <div class="admin-stat-label">Total upload</div>
                <div class="admin-stat-value" id="adminTotalUpload">-</div>
              </div>
            </div>
          </div>
        </div>
        <div class="dashboard-actions">
          <div class="search-container me-3">
            <div class="input-group">
              <span class="input-group-text">
                <span class="material-symbols-rounded">search</span>
              </span>
              <input type="text" id="searchInput" class="form-control" placeholder="Search samples...">
            </div>
          </div>
          <button type="button" onclick="createFilterDropDown()" class="btn btn-outline-primary btn-filters btn-actions"><span class="material-symbols-rounded btn_left_menu_icon">filter_list</span>FILTERS</button>
          <button onclick="ButtonGoTo('../html/upload.html')" type="button" class="btn btn-outline-primary btn-upload btn-actions"><span class="material-symbols-rounded btn_left_menu_icon">upload_file</span>UPLOAD</button>
        </div>
        <div id="filter_dropdown"></div>
        <div class="dashboard-table table-responsive basic-frame">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">MATERIAL</th>
                <th scope="col">PROJECT NAME</th>
                <th scope="col">LOCATION</th>
                <th scope="col">CREATION DATE</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </span>
    </div>

    <table id="test_table"></table>
    </main>
    <!--#endregion-->
  </div>
  <!--#endregion-->

  <!--#region BOOTSTRAP-->

  <!--BOOTSTRAP CDN JAVASCRIPT IMPORT *USE IF YOU NEED IT; **COMMENT THE "BOOTSTRAP LOCAL JAVASCRIPT IMPORT" BELOW BEFORE USE CDN-->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    -->

    <!--BOOSTRAP MINIMAL LOCAL JAVASCRIPT IMPORT-->
    <script src="../static/js/bootstrap.bundle.min.js"></script>

    <!--BOOTSTRAP JS LINK-->
    <script src="../static/js/button.js"></script>

  <!--#endregion-->

  <!--#region JQUERY-->
  <script src="../static/js/jquery.min.js"></script>
  <!--#endregion-->

  <!--#region INCLUDE ELEMENTS-->

  <!--HEADER INCLUDE-->
    <script src="../static/js/constants.js"></script>
    <script src="../static/js/include_elements.js"></script>
  
  <!--FILTER DROPDOWN INCLUDE-->
  <script src="../static/js/filter_control.js"></script>

  <!--DYNAMIC TABLE INCLUDE(TESTS)-->
  <script src="../static/js/dynamic_table.js"></script>
  
  <!--SOIL DATA MANAGER-->
  <script src="../static/js/soil_data_manager.js"></script>
  <!--#endregion-->

</body>
</html>
