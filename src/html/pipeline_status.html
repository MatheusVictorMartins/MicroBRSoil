<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>microBRsoil</title>

    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/header.css">
    <link rel="stylesheet" href="../static/css/footer.css">
    <link rel="stylesheet" href="../static/css/left_menu.css">
    <link rel="stylesheet" href="../static/css/dynamic-content.css">
    <style>
      .logs-panel {
        border: 1px solid #e3e8e0;
        border-radius: 8px;
      }
      .log-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .log-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 10px;
        background: #fff;
        border: 1px solid #ecf1ea;
        border-radius: 6px;
      }
      .log-dot {
        width: 10px;
        height: 10px;
        margin-top: 4px;
        border-radius: 50%;
        background: #2f855a;
        box-shadow: 0 0 0 3px rgba(47,133,90,0.12);
        flex-shrink: 0;
      }
      .log-text {
        font-size: 13px;
        color: #1f2933;
        line-height: 1.4;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tienne:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@300" rel="stylesheet" />
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="layout">
        <div id="leftmenu-placeholder"></div>
        <main class="main-content">
            <h1 class="main-title">PIPELINE STATUS</h1>

            <div class="basic-frame" style="margin-bottom: 16px;">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6 col-lg-5">
                        <label class="form-label text-input-label" for="trackerRunInput">RUN ID</label>
                        <input type="text" id="trackerRunInput" class="form-control" placeholder="Enter a run ID">
                    </div>
                    <div class="col-md-3 col-lg-2">
                        <label class="form-label text-input-label" for="pollInterval">REFRESH (s)</label>
                        <input type="number" min="3" max="60" step="1" id="pollInterval" class="form-control" value="5">
                    </div>
                    <div class="col-md-12 col-lg-5 d-flex justify-content-start justify-content-lg-end gap-2">
                        <button class="btn btn-primary px-3" id="startTrackingBtn">
                            <span class="material-symbols-rounded align-middle">play_arrow</span>
                            <span class="align-middle">Start</span>
                        </button>
                        <button class="btn btn-outline-secondary px-3" id="stopTrackingBtn">
                            <span class="material-symbols-rounded align-middle">stop_circle</span>
                            <span class="align-middle">Stop</span>
                        </button>
                        <button class="btn btn-outline-primary px-3" onclick="ButtonGoTo('/upload')">
                            <span class="material-symbols-rounded align-middle">cloud_upload</span>
                            <span class="align-middle">Upload</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="basic-frame" id="pipelineTracker" style="display: none;">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="fw-bold">Pipeline tracking</div>
                        <div class="small text-muted" id="trackerPipelineType"></div>
                        <div class="small text-muted" id="trackerRunId"></div>
                        <div class="small text-muted" id="trackerJobId"></div>
                    </div>
                    <div class="text-end">
                        <div>Status: <span id="trackerStatus" class="text-primary">—</span></div>
                        <div class="small text-muted" id="trackerUpdated"></div>
                    </div>
                </div>
                <div class="mt-2 small" id="trackerMessage"></div>
                <div class="mt-3 logs-panel basic-frame" style="background: #f8fbf7;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                        <div class="fw-bold text-uppercase small" style="letter-spacing: 0.08em;">Etapas do pipeline</div>
                        <div class="small text-muted">Últimos eventos registrados</div>
                        </div>
                        <div class="small text-muted" id="logsCount"></div>
                    </div>
                    <div class="log-list" id="trackerLogs"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../static/js/include_elements.js"></script>
    <script src="../static/js/button.js"></script>
    <script src="../static/js/bootstrap.bundle.min.js"></script>

    <script>
      const tracker = {
        intervalId: null,
        runId: null
      };

      const statusEl = () => document.getElementById('trackerStatus');
      const updatedEl = () => document.getElementById('trackerUpdated');
      const messageEl = () => document.getElementById('trackerMessage');
      const runEl = () => document.getElementById('trackerRunId');
      const jobEl = () => document.getElementById('trackerJobId');
      const typeEl = () => document.getElementById('trackerPipelineType');
      const trackerBox = () => document.getElementById('pipelineTracker');
      const logsEl = () => document.getElementById('trackerLogs');
      const logsCountEl = () => document.getElementById('logsCount');
      const lastRunKey = 'lastPipelineRun';

      document.addEventListener('DOMContentLoaded', () => {
        try {
          localStorage.removeItem(lastRunKey);
        } catch (e) {
          // ignore
        }
      });

      function startTracking(runId) {
        if (!runId) return;
        stopTracking();

        tracker.runId = runId.trim();

        if (trackerBox()) trackerBox().style.display = 'block';
        if (runEl()) runEl().textContent = `Run ID: ${tracker.runId}`;
        if (jobEl()) jobEl().textContent = '';
        if (typeEl()) typeEl().textContent = '';
        if (statusEl()) statusEl().textContent = 'queued';
        if (updatedEl()) updatedEl().textContent = 'Waiting for status...';
        if (messageEl()) messageEl().textContent = '';
        if (logsEl()) logsEl().innerHTML = '';

        const pollSeconds = Math.max(3, Math.min(60, parseInt(document.getElementById('pollInterval').value, 10) || 5));
        tracker.intervalId = setInterval(fetchStatus, pollSeconds * 1000);
        fetchStatus();
      }

      function stopTracking() {
        if (tracker.intervalId) {
          clearInterval(tracker.intervalId);
          tracker.intervalId = null;
        }
      }

      async function fetchStatus() {
        if (!tracker.runId) return;
        try {
          const response = await fetch(`/pipeline/status/${tracker.runId}`);
          if (response.status === 404) {
            // Run not found: clear saved run and reset UI
            localStorage.removeItem(lastRunKey);
            resetTrackerUI('Run not found. It may have been removed.');
            stopTracking();
            return;
          }
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!data.success || !data.run) throw new Error(data.error || 'Status unavailable');

          const run = data.run;
          const status = run.status || 'unknown';
          const started = run.started_at || run.startedAt;
          const finished = run.finished_at || run.finishedAt;
          const errorMessage = run.error_message || run.errorMessage;

          if (statusEl()) statusEl().textContent = status;
          if (updatedEl()) updatedEl().textContent = `Updated: ${new Date().toLocaleTimeString()}`;
          if (typeEl()) typeEl().textContent = run.pipeline_type ? run.pipeline_type.toUpperCase() : '';
          if (jobEl()) jobEl().textContent = run.job_id ? `Job ID: ${run.job_id}` : '';
          if (logsEl()) {
            const logs = Array.isArray(run.logs) ? run.logs : [];
            const count = logs.length;
            if (logsCountEl()) logsCountEl().textContent = count ? `${count} eventos` : 'Sem eventos';

            if (logs.length === 0) {
              logsEl().innerHTML = '<div class="text-muted small py-2">Sem logs registrados ainda.</div>';
            } else {
              const recent = logs.slice(-20).reverse(); // últimos 20, mais recentes no topo
              logsEl().innerHTML = recent.map(log => `
                <div class="log-item">
                  <div class="log-dot"></div>
                  <div class="log-text">${log}</div>
                </div>
              `).join('');
            }
          }

          if (messageEl()) {
            if (status === 'failed' && errorMessage) {
              messageEl().textContent = `Error: ${errorMessage}`;
            } else if (status === 'running' && started) {
              messageEl().textContent = `Started at: ${started}`;
            } else if (status === 'completed' && finished) {
              messageEl().textContent = `Finished at: ${finished}`;
            } else {
              messageEl().textContent = '';
            }
          }

          if (['completed', 'failed'].includes(status)) {
            stopTracking();
          }
        } catch (err) {
          if (updatedEl()) updatedEl().textContent = 'Status unavailable';
          if (messageEl()) messageEl().textContent = `Status check error: ${err.message}`;
        }
      }

      document.getElementById('startTrackingBtn').addEventListener('click', () => {
        const runId = document.getElementById('trackerRunInput').value;
        startTracking(runId);
      });

      document.getElementById('stopTrackingBtn').addEventListener('click', () => {
        stopTracking();
      });

      // Auto-fill with last run (from upload) if available
      (() => {
        try {
          const saved = localStorage.getItem(lastRunKey);
          if (saved) {
            const data = JSON.parse(saved);
            if (data.runId) {
              document.getElementById('trackerRunInput').value = data.runId;
              startTracking(data.runId);
            }
          }
        } catch (e) {
          // ignore
        }
      })();

      function resetTrackerUI(message) {
        if (trackerBox()) trackerBox().style.display = 'none';
        if (statusEl()) statusEl().textContent = '-';
        if (updatedEl()) updatedEl().textContent = '';
        if (messageEl()) messageEl().textContent = message || '';
        if (logsEl()) logsEl().innerHTML = '';
        if (logsCountEl()) logsCountEl().textContent = '';
      }
    </script>
</body>
</html>
