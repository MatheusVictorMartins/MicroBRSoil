<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>microBRsoil - Sample</title>
  <link rel="stylesheet" href="../static/css/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/reset.css">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="../static/css/header.css">
  <link rel="stylesheet" href="../static/css/left_menu.css">
  <link rel="stylesheet" href="../static/css/dynamic-content.css">
  <!--FONT IMPORT-->
  <!--INTER-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <!--TIENNE-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tienne:wght@400;700;900&display=swap" rel="stylesheet">
  <!--ICONS IMPORT-->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@300" rel="stylesheet" />
  <style>
    /* Minimalist adjustments for the individual page */
    .individual-container { max-width: 1100px; margin: 24px auto; }
    .sample-header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .card-list { display:flex; gap:12px; flex-wrap:wrap; }
    .card-item { min-width:240px; flex:1; }
    .files-list li { display:flex; justify-content:space-between; align-items:center; }
    .muted { color: #6c757d; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="leftmenu-placeholder"></div>
    <main class="main-content">
      <div class="individual-container">
        <div class="sample-header">
          <h1 id="sample-title" class="main-title">Sample details</h1>
          <div id="sample-meta" class="muted">Loading...</div>
        </div>

        <div class="row mt-3">
          <div class="col-md-7">
            <div class="basic-frame p-3">
              <h5>Basic information</h5>
              <div id="basic-info">Loading sample data...</div>
            </div>

            <div class="basic-frame p-3 mt-3">
              <h5>Alpha diversity tests</h5>
              <div id="alpha-tests">Loading alpha tests...</div>
            </div>
          </div>

          <div class="col-md-5">
            <div class="basic-frame p-3">
              <h5>Downloadable files</h5>
              <p class="muted">Upload files and result files related to this sample/run.</p>
              <div>
                <h6 class="mt-2">Upload files</h6>
                <ul id="upload-files" class="list-group files-list"></ul>
              </div>

              <div>
                <h6 class="mt-3">Result files</h6>
                <ul id="result-files" class="list-group files-list"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../static/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/jquery.min.js"></script>
  <script src="../static/js/include_elements.js"></script>

  <script>
    // Helper: read soilId from query string or hash
    function getSoilId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('soilId') || params.get('id') || null;
      return id ? id : null;
    }

    function renderBasicInfo(soil) {
      document.getElementById('sample-title').textContent = soil.sample_name || `Soil #${soil.soil_id}`;
      document.getElementById('sample-meta').textContent = `${soil.location || soil.geo_loc_name || 'Unknown location'} • ${soil.collection_date || ''}`;

      const info = `
        <p><strong>Sample name:</strong> ${soil.sample_name || 'N/A'}</p>
        <p><strong>Location:</strong> ${soil.location || soil.geo_loc_name || 'N/A'}</p>
        <p><strong>Collection date:</strong> ${soil.collection_date || 'N/A'}</p>
        <p><strong>Material:</strong> ${soil.material || soil.env_medium || 'N/A'}</p>
        <p><strong>Depth:</strong> ${soil.soil_depth ? soil.soil_depth + 'm' : 'N/A'}</p>
        <p><strong>Elevation:</strong> ${soil.elev ? soil.elev + 'm' : 'N/A'}</p>
        <p><strong>pH:</strong> ${soil.ph || 'N/A'}</p>
        <p><strong>Soil type:</strong> ${soil.soil_type || 'N/A'}</p>
        ${soil.coordinates ? `<p><strong>Coordinates:</strong> ${soil.coordinates.latitude.toFixed(4)}, ${soil.coordinates.longitude.toFixed(4)}</p>` : ''}
      `;
      document.getElementById('basic-info').innerHTML = info;
    }

    function renderAlphaTests(alphaRecords) {
      const container = document.getElementById('alpha-tests');
      if (!alphaRecords || alphaRecords.length === 0) {
        container.innerHTML = '<p class="muted">No alpha diversity records found for this soil.</p>';
        return;
      }

      let html = '<div class="card-list">';
      alphaRecords.forEach(a => {
        html += `
          <div class="card card-item">
            <div class="card-body">
              <h6 class="card-title">Alpha ID: ${a.alpha_id}</h6>
              <p class="card-text"><strong>Observed:</strong> ${a.alpha_observed}</p>
              <p class="card-text"><strong>Shannon:</strong> ${a.alpha_shannon}</p>
              <p class="card-text"><strong>Simpson:</strong> ${a.alpha_simpson}</p>
              <p class="card-text"><small class="muted">Chao1: ${a.alpha_chao1} • Goods: ${a.alpha_goods}</small></p>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function addFileList(targetId, files) {
      const ul = document.getElementById(targetId);
      ul.innerHTML = '';
      if (!files || files.length === 0) {
        ul.innerHTML = '<li class="list-group-item muted">No files found</li>';
        return;
      }

      files.forEach(f => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.innerHTML = `<span>${f.name || f}</span><a class="btn btn-sm btn-outline-primary" href="${f.url || ('/download/' + (f.path || f.name))}" target="_blank">Download</a>`;
        ul.appendChild(li);
      });
    }

    async function fetchSoil(soilId) {
      try {
        const res = await fetch(`/api/table/soil/${soilId}`);
        if (!res.ok) {
          console.error('Soil fetch HTTP error:', res.status, res.statusText);
          return null;
        }
        const data = await res.json();
        console.log('Soil data received:', data);
        if (data.success) return data.data;
        console.warn('Soil fetch failed - API returned success:false', data);
      } catch (e) { 
        console.error('Soil fetch exception:', e); 
      }
      return null;
    }

    async function fetchAlphaBySoil(soilId) {
      // Try endpoint dedicated to alpha tests; fallback to generic alpha list and filter
      try {
        const res = await fetch(`/api/table/alpha/soil/${soilId}`);
        if (res.ok) {
          const d = await res.json();
          console.log('Alpha tests received:', d);
          if (d.success) return d.data;
        } else {
          console.warn('Alpha fetch primary endpoint failed:', res.status);
        }
      } catch (e) { 
        console.warn('Alpha fetch primary exception:', e);
      }

      try {
        const res = await fetch('/api/table/alpha');
        if (res.ok) {
          const d = await res.json();
          if (d.success && Array.isArray(d.data)) {
            console.log('Alpha fallback - filtering from all records');
            return d.data.filter(a => String(a.soil_id) === String(soilId));
          }
        }
      } catch (e) { 
        console.warn('Alpha fetch fallback exception:', e);
      }
      return [];
    }

    async function fetchFilesForRun(runId) {
      if (!runId) return { uploads: [], results: [] };
      const uploads = [];
      const results = [];
      try {
        const u = await fetch(`/upload/files/${runId}`);
        if (u.ok) { const ud = await u.json(); if (ud.files) uploads.push(...ud.files); }
      } catch (e) { console.warn('Upload files fetch failed', e); }

      try {
        const r = await fetch(`/results/files/${runId}`);
        if (r.ok) { const rd = await r.json(); if (rd.files) results.push(...rd.files); }
      } catch (e) { console.warn('Results files fetch failed', e); }

      return { uploads, results };
    }

    // Main
    (async function() {
      const soilId = getSoilId();
      if (!soilId) {
        document.getElementById('sample-title').textContent = 'Error';
        document.getElementById('sample-meta').textContent = '';
        document.getElementById('basic-info').innerHTML = '<div class="alert alert-danger"><strong>Soil data not found</strong><br>No soil ID provided in URL. Please use <code>?soilId=123</code> or <code>?id=123</code>.</div>';
        document.getElementById('alpha-tests').innerHTML = '';
        return;
      }

      const soil = await fetchSoil(soilId);
      if (!soil) {
        document.getElementById('sample-title').textContent = 'Error';
        document.getElementById('sample-meta').textContent = '';
        document.getElementById('basic-info').innerHTML = '<div class="alert alert-danger"><strong>Soil data not found</strong><br>No soil sample found with ID <code>' + soilId + '</code>.</div>';
        document.getElementById('alpha-tests').innerHTML = '';
        return;
      }
      renderBasicInfo(soil);

      const alphas = await fetchAlphaBySoil(soilId);
      renderAlphaTests(alphas);

      // If soil has run_id or runId in response, try to fetch files
      const runId = soil.run_id || soil.runId || null;
      const files = await fetchFilesForRun(runId);
      addFileList('upload-files', files.uploads);
      addFileList('result-files', files.results);
    })();
  </script>
</body>
</html>
